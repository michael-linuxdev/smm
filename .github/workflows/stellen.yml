name: Offene Stellen aktualisieren
on:
  schedule:
    - cron: "17 4 * * *"   # täglich ca. 5:17/6:17 Uhr deutscher Zeit
  workflow_dispatch: {}      # manuell startbar unter „Actions“
permissions:
  contents: write
concurrency: stellen
jobs:
  holen:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Postleitzahlen (GeoNames) laden
        run: curl -fsSL https://download.geonames.org/export/zip/DE.zip -o /tmp/DE.zip && unzip -o -q /tmp/DE.zip DE.txt -d /tmp || echo "GeoNames nicht erreichbar"
      - run: node scripts/stellen-holen.mjs
        env:
          ADZUNA_ID: ${{ secrets.ADZUNA_ID }}
          ADZUNA_KEY: ${{ secrets.ADZUNA_KEY }}
      - name: Änderungen speichern
        run: |
          git config user.name "smm-coach-bot"
          git config user.email "smm-coach-bot@users.noreply.github.com"
          git add data/stellen.json data/plz.json 2>/dev/null || true
          git diff --cached --quiet || (git commit -m "Offene Stellen aktualisiert" && git push)
